<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquarePool — Football Squares</title>
    <meta
      name="description"
      content="Run a football squares pool or a weekly pick'em contest. Share one link, players join without an account, and scores and winners fill themselves in."
    />

    <!-- Previews for the site itself. A shared *board* is served from /i/<id>,
         which builds its own tags per board — a crawler never sees the fragment
         that carries the space code, so it cannot do it from here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SquarePool" />
    <meta property="og:title" content="SquarePool — Football Squares & Pick'em" />
    <meta
      property="og:description"
      content="Run the pool. Skip the paperwork. Squares boards and weekly pick'em, both from one link."
    />
    <meta property="og:image" content="/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SquarePool — Football Squares & Pick'em" />
    <meta name="twitter:image" content="/api/og" />

    <!--
      Palette source of truth.

      The app styles everything with inline objects, so CSS media queries and
      class-based theming can't reach it. Custom properties can: src/styles/theme.js
      resolves every token to var(--…), so swapping data-theme on <html> re-themes
      the entire app without touching a single component.

      Dark is the default. Light overrides only what changes.
    -->
    <style>
      :root {
        color-scheme: dark;

        --page-bg: #0a1a1a;
        --page-bg-mid: #0d2424;
        --page-bg-end: #102a2a;
        --surface-primary: #122e2e;
        --surface-deep: #0e2222;
        --surface-filled: #142e2e;

        /* The board's own surfaces. Kept apart from the general ones because a
           grid has to stay legible at a glance from across a room, which the
           near-black page surfaces are not. */
        --grid-cell-empty: #193939;
        --grid-cell-filled: #275454;
        --grid-cell-border: #ffffff24;
        --surface-input: #0e2424;
        --surface-admin-input: #1a3a3a;
        --surface-section: #0c2020;

        --text-headline: #ffffff;
        --text-primary: #e0ffff;
        --text-secondary: #c8e8e8;
        --text-muted: #8ab0b0;
        --text-dim: #555555;
        --text-dimmer: #444444;
        --text-dimmest: #333333;

        --accent-brand: #138484;
        --accent-brand-alt: #068484;
        --accent-green: #22aa44;
        --accent-green-bright: #4ade80;
        --accent-green-light: #44cc66;
        --accent-red: #ff6b6b;
        --accent-red-dark: #dd3333;
        --accent-red-deep: #ff2222;
        --accent-red-muted: #ff4444;
        --accent-gold: #ffd700;
        --accent-yellow: #facc15;
        --accent-orange: #ffaa44;
        --accent-pink: #b4f8f8;

        /* Graded pick chips: a tint that reads as a verdict, not a fill */
        --pick-win-bg: #4ade8022;
        --pick-win-border: #4ade8066;
        --pick-loss-bg: #ff6b6b22;
        --pick-loss-border: #ff6b6b66;
        --pick-lead-border: #4ade8055;
        --border-success: #4ade8040;
        --border-gold: #ffd70055;
        --border-accent-soft: #5ce7e733;
        --surface-accent-soft: #5ce7e715;
        --border-danger: #ff6b6b55;

        --border: #ffffff08;
        --border-light: #ffffff10;
        --border-input: #ffffff12;
        --border-subtle: #ffffff15;

        /* Tinted overlays used for raised/inset surfaces */
        --surface-1: #ffffff02;
        --surface-2: #ffffff04;
        --surface-3: #ffffff06;
        --surface-4: #ffffff08;
        --surface-5: #ffffff10;
        --surface-6: #ffffff12;
        --surface-7: #ffffff15;

        --overlay: rgba(0, 0, 0, 0.85);
        --overlay-light: rgba(0, 0, 0, 0.8);
        --overlay-subtle: rgba(0, 0, 0, 0.3);

        --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.3);
        --shadow-modal: 0 40px 80px rgba(0, 0, 0, 0.5);
        --glow-primary: 0 4px 20px #5ce7e740;
        --shadow-winner: 0 0 20px #ffd70030;

        --decor-1: radial-gradient(circle, #5ce7e710 0%, transparent 70%);
        --decor-2: radial-gradient(circle, #55f7f708 0%, transparent 70%);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        /* Daylight version of the same indigo — warm off-white, never stark */
        --page-bg: #f6fcfc;
        --page-bg-mid: #f0fafa;
        --page-bg-end: #e8f7f7;
        --surface-primary: #ffffff;
        --surface-deep: #f1fbfb;
        --surface-filled: #faffff;

        --grid-cell-empty: #f1fbfb;
        --grid-cell-filled: #faffff;
        --grid-cell-border: #16333326;
        --surface-input: #ffffff;
        --surface-admin-input: #ffffff;
        --surface-section: #f4fdfd;

        --text-headline: #163333;
        --text-primary: #1f4747;
        --text-secondary: #366363;
        --text-muted: #649090;
        --text-dim: #83a8a8;
        --text-dimmer: #9dbdbd;
        --text-dimmest: #b7d0d0;

        /* Accents darkened to stay legible on white */
        --accent-brand: #1b8484;
        --accent-brand-alt: #1a8484;
        --accent-green: #15803d;
        --accent-green-bright: #16a34a;
        --accent-green-light: #1c9c4d;
        --accent-red: #dc2626;
        --accent-red-dark: #b91c1c;
        --accent-red-deep: #dc2626;
        --accent-red-muted: #ef4444;
        --accent-gold: #b07d0a;
        --accent-yellow: #ca8a04;
        --accent-orange: #ea7317;
        --accent-pink: #26d3d3;

        --pick-win-bg: #16a34a1a;
        --pick-win-border: #16a34a66;
        --pick-loss-bg: #dc26261a;
        --pick-loss-border: #dc262666;
        --pick-lead-border: #16a34a55;
        --border-success: #16a34a4d;
        --border-gold: #b07d0a55;
        --border-accent-soft: #46d9d933;
        --surface-accent-soft: #46d9d914;
        --border-danger: #dc262655;

        --border: #16333314;
        --border-light: #1633331f;
        --border-input: #16333326;
        --border-subtle: #1633332e;

        --surface-1: #16333303;
        --surface-2: #16333306;
        --surface-3: #1633330a;
        --surface-4: #1633330f;
        --surface-5: #16333314;
        --surface-6: #1633331a;
        --surface-7: #16333322;

        --overlay: rgba(26, 22, 51, 0.55);
        --overlay-light: rgba(26, 22, 51, 0.45);
        --overlay-subtle: rgba(26, 22, 51, 0.18);

        --shadow-card: 0 6px 28px rgba(26, 22, 51, 0.1);
        --shadow-modal: 0 30px 70px rgba(26, 22, 51, 0.22);
        --glow-primary: 0 4px 18px #46d9d938;
        --shadow-winner: 0 0 20px #b07d0a40;

        --decor-1: radial-gradient(circle, #46d9d914 0%, transparent 70%);
        --decor-2: radial-gradient(circle, #3fd9d90f 0%, transparent 70%);
      }

      html,
      body {
        margin: 0;
        background: var(--page-bg);
      }
    
      /* The score ticker. Keyframes are the one thing an inline style object
         cannot express, and this <style> block is already where the theme
         palettes live, so it is the established place for them. */
      @keyframes sp-ticker {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }

      /* Someone who asked for less motion gets a ticker that simply sits
         still, rather than no scores at all. */
      @media (prefers-reduced-motion: reduce) {
        .sp-ticker-track {
          animation: none !important;
          transform: none !important;
        }
      }
    
      /* The success check. Drawing the stroke rather than fading in a glyph:
         the motion is what reads as "that worked". */
      @keyframes sp-check-ring {
        from { stroke-dashoffset: 166; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes sp-check-mark {
        from { stroke-dashoffset: 48; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes sp-modal-in {
        from { opacity: 0; transform: translateY(8px) scale(0.97); }
        to   { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .sp-check-ring,
        .sp-check-mark,
        .sp-modal {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>

    <!-- Resolve the theme before first paint so there's no flash of the wrong one -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sqrbet-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
