<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquarePool — Football Squares</title>

    <!--
      Palette source of truth.

      The app styles everything with inline objects, so CSS media queries and
      class-based theming can't reach it. Custom properties can: src/styles/theme.js
      resolves every token to var(--…), so swapping data-theme on <html> re-themes
      the entire app without touching a single component.

      Dark is the default. Light overrides only what changes.
    -->
    <style>
      :root {
        color-scheme: dark;

        --page-bg: #0a0a1a;
        --page-bg-mid: #0d0d24;
        --page-bg-end: #10102a;
        --surface-primary: #12122e;
        --surface-deep: #0e0e22;
        --surface-filled: #14142e;

        /* The board's own surfaces. Kept apart from the general ones because a
           grid has to stay legible at a glance from across a room, which the
           near-black page surfaces are not. */
        --grid-cell-empty: #191939;
        --grid-cell-filled: #272754;
        --grid-cell-border: #ffffff24;
        --surface-input: #0e0e24;
        --surface-admin-input: #1a1a3a;
        --surface-section: #0c0c20;

        --text-headline: #ffffff;
        --text-primary: #e0e0ff;
        --text-secondary: #c8c8e8;
        --text-muted: #8a8ab0;
        --text-dim: #555555;
        --text-dimmer: #444444;
        --text-dimmest: #333333;

        --accent-purple: #6c5ce7;
        --accent-violet: #a855f7;
        --accent-green: #22aa44;
        --accent-green-bright: #4ade80;
        --accent-green-light: #44cc66;
        --accent-red: #ff6b6b;
        --accent-red-dark: #dd3333;
        --accent-red-deep: #ff2222;
        --accent-red-muted: #ff4444;
        --accent-gold: #ffd700;
        --accent-yellow: #facc15;
        --accent-orange: #ffaa44;
        --accent-pink: #e8b4f8;

        /* Graded pick chips: a tint that reads as a verdict, not a fill */
        --pick-win-bg: #4ade8022;
        --pick-win-border: #4ade8066;
        --pick-loss-bg: #ff6b6b22;
        --pick-loss-border: #ff6b6b66;
        --pick-lead-border: #4ade8055;
        --border-success: #4ade8040;
        --border-gold: #ffd70055;
        --border-accent-soft: #6c5ce733;
        --border-danger: #ff6b6b55;

        --border: #ffffff08;
        --border-light: #ffffff10;
        --border-input: #ffffff12;
        --border-subtle: #ffffff15;

        /* Tinted overlays used for raised/inset surfaces */
        --surface-1: #ffffff02;
        --surface-2: #ffffff04;
        --surface-3: #ffffff06;
        --surface-4: #ffffff08;
        --surface-5: #ffffff10;
        --surface-6: #ffffff12;
        --surface-7: #ffffff15;

        --overlay: rgba(0, 0, 0, 0.85);
        --overlay-light: rgba(0, 0, 0, 0.8);
        --overlay-subtle: rgba(0, 0, 0, 0.3);

        --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.3);
        --shadow-modal: 0 40px 80px rgba(0, 0, 0, 0.5);
        --glow-primary: 0 4px 20px #6c5ce740;
        --shadow-winner: 0 0 20px #ffd70030;

        --decor-1: radial-gradient(circle, #6c5ce710 0%, transparent 70%);
        --decor-2: radial-gradient(circle, #a855f708 0%, transparent 70%);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        /* Daylight version of the same indigo — warm off-white, never stark */
        --page-bg: #f8f6fc;
        --page-bg-mid: #f3f0fa;
        --page-bg-end: #ece8f7;
        --surface-primary: #ffffff;
        --surface-deep: #f4f1fb;
        --surface-filled: #fbfaff;

        --grid-cell-empty: #f4f1fb;
        --grid-cell-filled: #fbfaff;
        --grid-cell-border: #1a163326;
        --surface-input: #ffffff;
        --surface-admin-input: #ffffff;
        --surface-section: #f7f4fd;

        --text-headline: #1a1633;
        --text-primary: #241f47;
        --text-secondary: #3d3663;
        --text-muted: #6b6490;
        --text-dim: #8a83a8;
        --text-dimmer: #a49dbd;
        --text-dimmest: #bdb7d0;

        /* Accents darkened to stay legible on white */
        --accent-purple: #5b46d9;
        --accent-violet: #8b3fd9;
        --accent-green: #15803d;
        --accent-green-bright: #16a34a;
        --accent-green-light: #1c9c4d;
        --accent-red: #dc2626;
        --accent-red-dark: #b91c1c;
        --accent-red-deep: #dc2626;
        --accent-red-muted: #ef4444;
        --accent-gold: #b07d0a;
        --accent-yellow: #ca8a04;
        --accent-orange: #ea7317;
        --accent-pink: #c026d3;

        --pick-win-bg: #16a34a1a;
        --pick-win-border: #16a34a66;
        --pick-loss-bg: #dc26261a;
        --pick-loss-border: #dc262666;
        --pick-lead-border: #16a34a55;
        --border-success: #16a34a4d;
        --border-gold: #b07d0a55;
        --border-accent-soft: #5b46d933;
        --border-danger: #dc262655;

        --border: #1a163314;
        --border-light: #1a16331f;
        --border-input: #1a163326;
        --border-subtle: #1a16332e;

        --surface-1: #1a163303;
        --surface-2: #1a163306;
        --surface-3: #1a16330a;
        --surface-4: #1a16330f;
        --surface-5: #1a163314;
        --surface-6: #1a16331a;
        --surface-7: #1a163322;

        --overlay: rgba(26, 22, 51, 0.55);
        --overlay-light: rgba(26, 22, 51, 0.45);
        --overlay-subtle: rgba(26, 22, 51, 0.18);

        --shadow-card: 0 6px 28px rgba(26, 22, 51, 0.1);
        --shadow-modal: 0 30px 70px rgba(26, 22, 51, 0.22);
        --glow-primary: 0 4px 18px #5b46d938;
        --shadow-winner: 0 0 20px #b07d0a40;

        --decor-1: radial-gradient(circle, #5b46d914 0%, transparent 70%);
        --decor-2: radial-gradient(circle, #8b3fd90f 0%, transparent 70%);
      }

      html,
      body {
        margin: 0;
        background: var(--page-bg);
      }
    </style>

    <!-- Resolve the theme before first paint so there's no flash of the wrong one -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sqrbet-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
